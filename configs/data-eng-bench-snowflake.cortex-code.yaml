# data-eng-bench — Snowflake — Cortex Code
#
# Requires a Snowflake account with the DBT_BENCH_RETAIL database seeded once
# (see README.md "Quickstart (Snowflake)" -> migrate_duckdb.py). Verifiers and
# the agent connect to Snowflake via the env vars below; DB_TYPE=snowflake
# switches dbt to the dbt-snowflake adapter.
#
# Export these before running (or put them in your shell profile):
#   export SNOWFLAKE_ACCOUNT=...      # e.g. abcd-xy12345
#   export SNOWFLAKE_USER=...
#   export SNOWFLAKE_PASSWORD=...     # or use key-pair auth (SNOWFLAKE_PRIVATE_KEY)
#   export SNOWFLAKE_WAREHOUSE=COMPUTE_WH
#   export SNOWFLAKE_SOURCE_DATABASE=DBT_BENCH_RETAIL   # DB the per-task healthcheck clones
#   export SNOWFLAKE_ROLE=SYSADMIN    # a role with USAGE on DBT_BENCH_RETAIL
#
# Run:
#   harbor run --config configs/data-eng-bench-snowflake.claude-code.yaml \
#     --path tasks -m anthropic/claude-opus-4-8 --ak reasoning_effort=high

name: data-eng-bench-snowflake

n_attempts: 3          # leaderboard requires >= 3 trials per task
n_concurrent_trials: 4
quiet: true

environment:
  type: docker
  env:
    - DB_TYPE=snowflake
    - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT}
    - SNOWFLAKE_USER=${SNOWFLAKE_USER}
    - SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD}
    - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
    - SNOWFLAKE_SOURCE_DATABASE=${SNOWFLAKE_SOURCE_DATABASE:-DBT_BENCH_RETAIL}
    - SNOWFLAKE_SCHEMA=${SNOWFLAKE_SCHEMA:-main}
    - SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-SYSADMIN}

agents:
  - name: cortex-code
    model_name: anthropic/claude-opus-4-8
    kwargs:
      reasoning_effort: high
      # benchmark integrity: Cortex Code keeps web_search / web_fetch available in
      # every agent mode, including code mode. Harbor's cortex-code agent gained
      # disallowed_tools in harbor-framework/harbor#2787, which is MERGED but not
      # in a release yet -- v0.21.0 does not have it, and Harbor drops an unknown
      # kwarg silently, so uncommenting before the next release would read as
      # protection while changing nothing. Uncomment once a release ships; until
      # then use --allow-agent-host to keep the agent off the open internet.
      # disallowed_tools: web_search web_fetch

  # Portable fallback if your Harbor build has no native `cortex-code` agent:
  # - name: terminus-2
  #   model_name: anthropic/claude-opus-4-8
  #   kwargs:
  #     reasoning_effort: high
