# data-eng-bench — Snowflake — Claude Code
#
# Requires a Snowflake account with the DBT_BENCH_RETAIL database seeded once
# (see README.md "Quickstart (Snowflake)" -> migrate_duckdb.py). Verifiers and
# the agent connect to Snowflake via the env vars below; DB_TYPE=snowflake
# switches dbt to the dbt-snowflake adapter.
#
# Export these before running (or put them in your shell profile):
#   export SNOWFLAKE_ACCOUNT=...      # e.g. abcd-xy12345
#   export SNOWFLAKE_USER=...
#   export SNOWFLAKE_PASSWORD=...     # or use key-pair auth (SNOWFLAKE_PRIVATE_KEY)
#   export SNOWFLAKE_WAREHOUSE=COMPUTE_WH
#   export SNOWFLAKE_SOURCE_DATABASE=DBT_BENCH_RETAIL   # DB the per-task healthcheck clones
#   export SNOWFLAKE_ROLE=SYSADMIN    # a role with USAGE on DBT_BENCH_RETAIL
#
# Run:
#   harbor run --config configs/data-eng-bench-snowflake.claude-code.yaml \
#     --path tasks -m anthropic/claude-opus-4-8 --ak reasoning_effort=high

name: data-eng-bench-snowflake

n_attempts: 3          # leaderboard requires >= 3 trials per task
n_concurrent_trials: 4
quiet: true

environment:
  type: docker
  # Only DB_TYPE is set here. The SNOWFLAKE_* credentials are intentionally NOT
  # listed: each task's environment/docker-compose.yaml already forwards
  # ${SNOWFLAKE_*} from the host environment, so exporting them in your shell
  # (see header) is enough — they flow straight through to the container.
  #
  # Do NOT re-add them here. Stock Harbor stores run-config env verbatim (it does
  # not resolve ${VAR} templates in environment.env), so a line like
  # `SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD}` injects the literal string
  # "${SNOWFLAKE_PASSWORD}" into the compose env and clobbers the real exported
  # value, breaking Snowflake auth.
  env:
    - DB_TYPE=snowflake

agents:
  - name: claude-code
    model_name: anthropic/claude-opus-4-8
    kwargs:
      reasoning_effort: high
      disallowed_tools: WebSearch,WebFetch   # benchmark integrity: no web solution lookup during agent.run()
