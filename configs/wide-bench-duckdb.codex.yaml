# wide-bench — DuckDB (hermetic) — Codex
#
# Zero Snowflake account required. Each task builds the wide-bench base image,
# which bakes in retail.duckdb; DB_TYPE=duckdb points dbt at that local file.
#
# Run:
#   harbor run --config configs/wide-bench-duckdb.codex.yaml \
#     --path tasks -m openai/gpt-5.6 --ak reasoning_effort=high

name: wide-bench-duckdb

n_attempts: 3          # 3 trials per task
n_concurrent_trials: 4
quiet: true

environment:
  type: docker         # builds each task's environment/Dockerfile (FROM wide-bench-base:1.0.0)
  env:
    - DB_TYPE=duckdb

agents:
  - name: codex
    model_name: openai/gpt-5.6
    kwargs:
      reasoning_effort: high
      web_search: disabled   # benchmark integrity: no web solution lookup during agent.run()
