# Harbor dataset manifest for dbt-bench.
#
# Source of truth for the tasks published under snowflake-labs/dbt-bench. Normally
# (re)generated by `harbor dataset init`, which auto-adds every task dir under
# tasks/ and stamps each with its sha256 archive digest. The `digest` values
# below are placeholders -- recomputed and pinned by `harbor publish` at release
# time (see PUBLISHING.md). After publishing, copy the canonical dataset ref into
# leaderboard/src/leaderboard/core/hub.py (DATASET_REF).
#
# Docs: https://www.harborframework.com/docs/datasets/publishing

name = "snowflake-labs/dbt-bench"
version = "1.0.0"
description = "Agentic dbt data-engineering benchmark: 103 real-world dbt tasks (analytics, dimensional modeling, incremental models, bug-fixes, snapshots) runnable hermetically on DuckDB or against Snowflake via DB_TYPE. A 30-task balanced fast subset for cost-bounded / CI runs is listed in configs/fast-30.txt."
author = "Snowflake <opensource@snowflake.com>"
license = "Apache-2.0"
tags = ["dbt", "data-engineering", "sql", "duckdb", "snowflake", "analytics"]

