version: 2

models:
  - name: stg_wms__adjustments
    description: |
      Staging model for ADJUSTMENTS from WMS

      This is a table containing adjustments data.
      Light transformations applied: column name standardization, trimming, and type casting.

    columns:
      - name: adjustment_id
        description: Unique identifier for the adjustment
        tests:
          - not_null
          - unique
      - name: adjustment_number
        description: Number/reference identifier
      - name: warehouse_id
        description: Unique identifier for the warehouse
      - name: adjustment_type
        description: Adjustment Type
      - name: status
        description: Status
      - name: total_lines
        description: Total Lines
      - name: total_quantity
        description: Quantity value
      - name: total_value
        description: Total Value
      - name: reason_code
        description: Code value for reason
      - name: notes
        description: Notes
      - name: requested_by
        description: Requested By
      - name: requested_at
        description: Timestamp when the record was requested
        tests:
          - not_null
      - name: approved_by
        description: Approved By
      - name: created_at
        description: Timestamp when the record was created
        tests:
          - not_null
      - name: updated_at
        description: Timestamp when the record was updated
        tests:
          - not_null
      - name: _loaded_at
        description: Timestamp when the record was _loaded
        tests:
          - not_null
      - name: _source_system
        description: "Metadata: source system identifier"
      - name: _batch_id
        description: "Unique identifier for the _batch"
      - name: _row_number
        description: Number/reference identifier
      - name: _row_hash
        description: "Metadata: row hash for change detection"

