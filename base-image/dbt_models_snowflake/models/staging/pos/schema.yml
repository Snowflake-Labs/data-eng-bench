version: 2

models:
  - name: stg_pos__coupons
    description: |
      Staging model for COUPONS from POS

      This is a table containing coupons data.
      Light transformations applied: column name standardization, trimming, and type casting.

    columns:
      - name: coupon_id
        description: Unique identifier for the coupon
        tests:
          - not_null
          - unique
      - name: coupon_code
        description: Code value for coupon
      - name: promotion_id
        description: Unique identifier for the promotion
      - name: usage_limit
        description: Usage Limit
      - name: usage_count
        description: Usage Count
      - name: is_active
        description: Boolean flag
      - name: expires_at
        description: Timestamp when the record was expires
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the record was created
        tests:
          - not_null
      - name: _loaded_at
        description: Timestamp when the record was _loaded
        tests:
          - not_null
      - name: _source_system
        description: "Metadata: source system identifier"
      - name: _batch_id
        description: "Unique identifier for the _batch"
      - name: _row_number
        description: Number/reference identifier
      - name: _row_hash
        description: "Metadata: row hash for change detection"

