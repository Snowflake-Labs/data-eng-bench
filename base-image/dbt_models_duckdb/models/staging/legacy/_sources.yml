version: 2

sources:
  - name: legacy
    description: |
      Legacy AS/400 system - historical product and vendor data

      This source contains raw data extracted from the LEGACY system.
      Data is loaded via ELT processes and stored in the RAW_LEGACY schema.

    schema: RAW_LEGACY

    # Source freshness checks
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}

    # Metadata for all tables
    meta:
      owner: "data-engineering@company.com"
      source_system: "legacy"

    tables:
      - name: APINV
        description: |
          Source table from LEGACY
          Entity type: table
        meta:
          entity_type: "table"
        loaded_at_field: _LOADED_AT

