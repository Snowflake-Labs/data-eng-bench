version: 2

sources:
  - name: wms
    description: |
      Warehouse Management System - inventory movements, locations, and fulfillment operations

      This source contains raw data extracted from the WMS system.
      Data is loaded via ELT processes and stored in the RAW_WMS schema.

    schema: RAW_WMS

    # Source freshness checks
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}

    # Metadata for all tables
    meta:
      owner: "data-engineering@company.com"
      source_system: "wms"

    tables:
      - name: ADJUSTMENTS
        description: |
          Source table from WMS
          Entity type: table
        meta:
          entity_type: "table"
        loaded_at_field: _LOADED_AT

