        description: Compare At Price
      - name: cost_price
        description: Cost Price
      - name: min_qty
        description: Quantity value
      - name: max_qty
        description: Quantity value
      - name: customer_tier_id
        description: Unique identifier for the customer_tier
      - name: channel_id
        description: Unique identifier for the channel
      - name: effective_from
        description: Effective From
      - name: effective_to
        description: Effective To
      - name: is_active
        description: Boolean flag
      - name: created_at
        description: Timestamp when the record was created
        tests:
          - not_null
      - name: updated_at
        description: Timestamp when the record was updated
        tests:
          - not_null
      - name: created_by
        description: Created By
      - name: _loaded_at
        description: Timestamp when the record was _loaded
        tests:
          - not_null
      - name: _source_system
        description: "Metadata: source system identifier"
      - name: _batch_id
        description: "Unique identifier for the _batch"
      - name: _row_number
        description: Number/reference identifier
      - name: _row_hash
