models:
  - name: stg_sap__a305
    description: |
      Staging model for A305 from SAP

      This is a table containing a305 data.
      Light transformations applied: column name standardization, trimming, and type casting.

    columns:
      - name: price_id
        description: Unique identifier for the price
        tests:
          - not_null
          - unique
      - name: variant_id
        description: Unique identifier for the variant
      - name: price_type
        description: Price Type
      - name: currency_code
        description: Code value for currency
      - name: price_amount
        description: Monetary amount
        tests:
          - not_null:
              config:
                where: "price_amount is not null"
